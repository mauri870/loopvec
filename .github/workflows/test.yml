name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test tsvc (amd64, SIMD)
        run: make tsvc-test

      - name: Install qemu-user-static
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Test tsvc (arm64, qemu)
        run: make tsvc-test-qemu-arm64

      - name: Check generated files and goldens are up to date
        run: |
          make test-update
          git diff --exit-code

      - name: Fmt
        run: |
          make fmt
          git diff --exit-code

      - name: Lint
        run: make lint
